# gateway 的本地业务配置。
# 这里只放网关关心的配置，共享基础设施配置来自 shared.local.yaml。
redis:
  # 网关自身的 Redis key 前缀，避免和其他服务冲突。
  key: "gateway:"

passportJwt:
  # 网关验签访问令牌使用的密钥，生产环境应放入 etcd。
  accessSecret: "change-me-access-secret"
updateRpc:
  # 网关通过 RPC 访问更新服务，本地调试时直连 update-service。
  target: "127.0.0.1:62000"

campusCredential:
  # 校园凭证加密主密钥和临时 token 生命周期。
  masterKey: "change-me-campus-master-key"
  tokenTTL: "2160h"

mediaStorage:
  # 当前项目本地默认走 MinIO。
  type: "minio"
  publicURL: "http://127.0.0.1:9000/hfjj-media"
  minIO:
    endpoint: "127.0.0.1:9000"
    accessKeyID: "CHANGE_ME"
    secretAccessKey: "CHANGE_ME"
    bucket: "hfjj-media"
    useSSL: false
    region: ""
    objectPrefix: "media"
    autoCreateBucket: true

payment:
  # 本地不启用真实支付，保留结构便于联调。
  alipay:
    appID: ""
    privateKey: ""
    alipayPublicKey: ""
    notifyURL: ""
    returnURL: ""
    sandbox: false
  wechat:
    appID: ""
    mchID: ""
    APIv3Key: ""
    serialNo: ""
    privateKey: ""
    platformPublicKey: ""
    notifyURL: ""
    sandbox: false

commercial:
  # 商业化策略参数，控制广告插入节奏和展示频率。
  advertisement:
    amountCents: 30000
    durationDays: 30
    firstAdAfterPosts: 7
    nextAdMinPosts: 10
    nextAdMaxPosts: 14
    maxAdsPerPage: 1
    maxAdsPer50Posts: 3
    sameAdCooldownHours: 6
    lightReductionAfter: 12
    candidateCacheSecond: 30
  # 会员策略本地可留空；为空时由代码内置默认策略接管。
  membership:
    policies: []

# 下游服务本地直连地址。
passportRpc:
  target: "127.0.0.1:20000"

schoolRpc:
  target: "127.0.0.1:30000"

captchaRpc:
  target: "127.0.0.1:61000"

relationRpc:
  target: "127.0.0.1:40000"

contentRpc:
  target: "127.0.0.1:50000"

imRpc:
  target: "127.0.0.1:60000"

