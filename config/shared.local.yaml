# 所有服务共享的本地基础设施配置。
# 本地文件模式下会先读取本文件，再叠加各服务自己的业务配置。
etcd:
  # 本地调试时也保留 etcd 注册信息，便于 go-zero 的 RPC 注册与发现保持一致。
  endpoints:
    - "127.0.0.1:2379"
  namespace: "/hfjj/local"

postgres:
  # 本地开发默认使用统一的测试库。
  dsn: "postgres://postgres:postgres@127.0.0.1:5432/hfjj?sslmode=disable&search_path=public"

redis:
  # Redis 作为缓存、锁和部分业务计数的共享依赖。
  host: "127.0.0.1:6379"
  type: "node"
  pass: ""

mq:
  # 默认关闭 MQ，便于本地先跑通主链路；需要事件流时再手动开启。
  enabled: false
  url: "amqp://guest:guest@127.0.0.1:5672/"
  exchange: "hfjj.biz.event"
  exchangeType: "topic"
  durable: true


